# Let the device follow a 44.1kHz source (Spotify) natively instead of
# resampling it to 48k, which cost ~5 xruns/min on its own.
#
# The quantum settings below are inert and kept only to document the dead end:
# neither clock.force-quantum (runtime-only metadata, ignored in config files)
# nor clamping min == max constrains the ALSA driver node. The quantum is
# actually pinned per-node in
# ~/.config/wireplumber/wireplumber.conf.d/50-alsa-period-size.conf.
context.properties = {
  default.clock.quantum       = 2048
  default.clock.min-quantum   = 2048
  default.clock.max-quantum   = 2048
  default.clock.allowed-rates = [ 44100, 48000 ]
}
