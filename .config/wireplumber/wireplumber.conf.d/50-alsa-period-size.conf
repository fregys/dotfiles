# The ALSA sink runs at its own period size, which the global clock
# min/max-quantum settings do not constrain — only runtime force-quantum did,
# and that cannot be set from a config file. Set the period directly instead.
# Measured on this box: 11-13 xruns/min at 1024, none at 2048.
monitor.alsa.rules = [
  {
    matches = [
      { node.name = "~alsa_output.*" }
    ]
    actions = {
      update-props = {
        api.alsa.period-size = 2048
        api.alsa.headroom    = 2048
        # Pin the graph quantum from the driver node. The global
        # clock.force-quantum did this at runtime and measured 0 xruns, but it
        # is runtime-only metadata; this is its persistent, per-node equivalent.
        node.force-quantum   = 2048
      }
    }
  }
]
